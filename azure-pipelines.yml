trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  name: Default

variables:
  - group: VG-DEFECTDOJO-SECRETS
  - name: DD_SCHEME
    value: 'http'
  - name: DD_CHART_VERSION
    value: '1.9.5'
  - name: DD_HOST
    value: 'defectdojo.local'

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        displayName: Lint and basic checks
        steps:
          - checkout: self

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 'latest'

          - task: PowerShell@2
            displayName: Agent tooling check (helm/kubectl)
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                function Find-Exe([string]$name, [string[]]$candidates) {
                  $cmd = Get-Command $name -ErrorAction SilentlyContinue
                  if ($cmd) { return $cmd.Source }
                  foreach ($c in $candidates) {
                    if (Test-Path -LiteralPath $c) { return $c }
                  }
                  try {
                    $w = (where.exe $name 2>$null | Select-Object -First 1)
                    if ($w) { return $w }
                  } catch {}
                  return $null
                }

                $helm = Find-Exe 'helm' @(
                  'C:\ProgramData\chocolatey\bin\helm.exe',
                  'C:\Program Files\Helm\helm.exe',
                  'C:\tools\helm\helm.exe'
                )
                if (-not $helm) { throw 'helm.exe not found on agent PATH (or common locations). Install Helm or add it to PATH.' }
                Write-Host "Found helm: $helm"
                Write-Host "##vso[task.prependpath]$(Split-Path -Parent $helm)"

                $kubectl = Find-Exe 'kubectl' @(
                  'C:\ProgramData\chocolatey\bin\kubectl.exe',
                  'C:\Program Files\Kubernetes\kubectl.exe',
                  'C:\tools\kubectl\kubectl.exe'
                )
                if (-not $kubectl) { throw 'kubectl.exe not found on agent PATH (or common locations). Install kubectl or add it to PATH.' }
                Write-Host "Found kubectl: $kubectl"
                Write-Host "##vso[task.prependpath]$(Split-Path -Parent $kubectl)"

                kubectl version --client
                helm version

          - task: PowerShell@2
            displayName: Verify required files exist
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                $required = @(
                  'azure-pipelines.yml',
                  'k8s/defectdojo-values.yaml',
                  'scripts/aks-login.ps1',
                  'scripts/install-defectdojo.ps1',
                  'scripts/post-install-bootstrap.ps1',
                  'README.md'
                )

                foreach ($path in $required) {
                  if (-not (Test-Path -LiteralPath $path)) {
                    throw "Missing required file: $path"
                  }
                }

                Write-Host 'All required files are present.'

          - task: PowerShell@2
            displayName: Helm lint (no cluster)
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                $repoName = 'defectdojo'
                $repoUrl = 'https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts'
                $chartRef = 'defectdojo/defectdojo'
                $chartVersion = "$(DD_CHART_VERSION)"

                $chartDir = Join-Path $env:Agent_TempDirectory "dd-chart-$chartVersion"
                if (Test-Path -LiteralPath $chartDir) {
                  Remove-Item -Recurse -Force -LiteralPath $chartDir
                }

                helm repo add $repoName $repoUrl --force-update | Out-Host
                helm repo update | Out-Host

                helm pull $chartRef --version $chartVersion --untar --untardir $chartDir | Out-Host
                $localChartPath = Join-Path $chartDir 'defectdojo'

                helm lint $localChartPath -f k8s/defectdojo-values.yaml --set host="$(DD_HOST)" | Out-Host

  - stage: Deploy
    displayName: Deploy (main)
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Deploy
        displayName: Deploy DefectDojo
        steps:
          - checkout: self

          - task: HelmInstaller@1
            displayName: Install Helm
            inputs:
              helmVersionToInstall: 'latest'

          - task: AzureCLI@2
            displayName: Login to Azure, deploy to AKS
            name: deploy_defectdojo
            inputs:
              azureSubscription: $(AZURE_SERVICE_CONNECTION)
              scriptType: ps
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                function Find-Exe([string]$name, [string[]]$candidates) {
                  $cmd = Get-Command $name -ErrorAction SilentlyContinue
                  if ($cmd) { return $cmd.Source }
                  foreach ($c in $candidates) {
                    if (Test-Path -LiteralPath $c) { return $c }
                  }
                  try {
                    $w = (where.exe $name 2>$null | Select-Object -First 1)
                    if ($w) { return $w }
                  } catch {}
                  return $null
                }

                $helm = Find-Exe 'helm' @(
                  'C:\ProgramData\chocolatey\bin\helm.exe',
                  'C:\Program Files\Helm\helm.exe',
                  'C:\tools\helm\helm.exe'
                )
                if ($helm) {
                  Write-Host "Found helm: $helm"
                  $env:PATH = "$(Split-Path -Parent $helm);$env:PATH"
                }

                $kubectl = Find-Exe 'kubectl' @(
                  'C:\ProgramData\chocolatey\bin\kubectl.exe',
                  'C:\Program Files\Kubernetes\kubectl.exe',
                  'C:\tools\kubectl\kubectl.exe'
                )
                if ($kubectl) {
                  Write-Host "Found kubectl: $kubectl"
                  $env:PATH = "$(Split-Path -Parent $kubectl);$env:PATH"
                }

                Write-Host 'Tooling versions (self-hosted agent):'
                az version
                kubectl version --client
                helm version

                # Expose pipeline variables to the PowerShell scripts as environment variables.
                $env:AKS_RG = "$(AKS_RG)"
                $env:AKS_NAME = "$(AKS_NAME)"
                $env:DD_HOST = "$(DD_HOST)"
                $env:DD_SCHEME = "$(DD_SCHEME)"
                $env:DD_CHART_VERSION = "$(DD_CHART_VERSION)"

                Write-Host 'Helm repo diagnostics (before install):'
                helm repo list | Out-Host
                helm repo add defectdojo 'https://raw.githubusercontent.com/DefectDojo/django-DefectDojo/helm-charts' --force-update | Out-Host
                helm repo update | Out-Host
                helm search repo defectdojo/defectdojo --versions | Select-Object -First 10 | Out-Host

                pwsh -NoProfile -File "$(System.DefaultWorkingDirectory)\scripts\aks-login.ps1"
                pwsh -NoProfile -File "$(System.DefaultWorkingDirectory)\scripts\install-defectdojo.ps1"
                pwsh -NoProfile -File "$(System.DefaultWorkingDirectory)\scripts\post-install-bootstrap.ps1"
