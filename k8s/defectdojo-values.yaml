# PoC-friendly defaults for DefectDojo on AKS.
# The pipeline overrides the hostname via --set host=$env:DD_HOST.

# Primary hostname used by Django/allowed hosts.
host: defectdojo.local

django:
  # Ingress
  # NOTE: the chart's ingress is under django.ingress.*
  ingress:
    enabled: true
    ingressClassName: nginx
    activateTLS: false

  uwsgi:
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

  nginx:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

  # Persist uploaded media (PoC size). For AKS default storage class, ReadWriteOnce is safest.
  mediaPersistentVolume:
    enabled: true
    type: pvc
    persistentVolumeClaim:
      create: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce
      storageClassName: ""

# Inject additional environment variables into the Django + Celery containers.
extraEnv:
  - name: DD_ENABLE_AUDITLOG
    value: "False"

# Reduce resource requests to fit in small (1-node) AKS clusters.
dbMigrationChecker:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Chart-managed in-cluster PostgreSQL (bitnami/postgresql)
postgresql:
  enabled: true
  primary:
    persistence:
      enabled: true
      size: 10Gi

# Chart-managed in-cluster Redis-compatible broker (valkey)
valkey:
  enabled: true

# The initializer Job does not inherit global extraEnv; set it explicitly.
initializer:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  extraEnv:
    - name: DD_ENABLE_AUDITLOG
      value: "False"

celery:
  beat:
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  worker:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
